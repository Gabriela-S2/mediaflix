<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaFlix</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/app.js"></script>
</head>
<body>
<header id="navbar">
    <div style="display: flex; align-items: center;">
        <a href="index.html" style="text-decoration: none;"><h1 class="logo">MediaFlix</h1></a>
        <nav class="nav-links">
            <a href="#">Início</a>
            <a href="#">Séries</a>
            <a href="#">Filmes</a>
            <a href="#">Minha Lista</a>
        </nav>
    </div>

    <!-- Menu do Usuário (Avatar e Dropdown) -->
    <div class="user-menu" id="user-menu">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Avatar" class="avatar" id="avatar-btn">
        <div class="dropdown-menu">
            <a href="#">Editar Perfil</a>
            <a href="#">Alterar Assinatura</a>
            <a href="#" id="btn-logout">Sair do MediaFlix</a>
        </div>
    </div>
</header>

<section class="hero" id="hero-section">
    <div class="hero-content">
        <h2 id="featured-title">Carregando...</h2>
        <p id="featured-desc">Aguarde enquanto os dados são carregados do servidor.</p>
        <div class="hero-buttons">
            <button class="btn-play">▶ Assistir</button>
            <button class="btn-info">ℹ Mais Informações</button>
        </div>
    </div>
</section>

<main>
    <div class="media-row">
        <h3>Adicionados Recentemente</h3>
        <div class="media-carousel" id="trending-list">
            <!-- Os filmes serão injetados aqui via JavaScript -->
        </div>
    </div>
</main>


</body>
</html>
