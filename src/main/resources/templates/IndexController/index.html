<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaFlix</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js"></script>
</head>
<body>
<header id="navbar">
    <div style="display: flex; align-items: center;">
        <a href="/index" style="text-decoration: none;"><h1 class="logo">MediaFlix</h1></a>
        <nav class="nav-links">
            <a href="#hero-section">Início</a>
            <a href="#section-filmes">Filmes</a>
            <a href="#section-series">Séries</a>
            <a href="#section-minha-lista">Minha Lista</a>
        </nav>
    </div>

    <div class="user-menu" id="user-menu">
        <img src="/midia/novo_usuario.png" alt="Avatar" class="avatar" id="avatar-btn">
        <div class="dropdown-menu">
            <a href="#" id="btn-abrir-perfil">Editar Perfil e Plano</a>
            <a href="#" id="btn-logout">Sair do MediaFlix</a>
        </div>
    </div>
</header>

<section class="hero" id="hero-section">
    <div class="hero-content">
        <h2 id="featured-title">Carregando...</h2>
        <p id="featured-desc">Aguarde enquanto os dados são carregados do servidor.</p>
        <div class="hero-buttons">
            <button class="btn-play">▶ Assistir</button>
            <button class="btn-info">ℹ Mais Informações</button>
        </div>
    </div>
</section>

<main>
    <!-- 1. Sugeridos (visível apenas quando o usuário possui preferências via Like) -->
    <div class="media-row" id="section-sugeridos" style="display: none;">
        <h3>Sugeridos para Você <small id="sugeridos-subtitulo" class="row-subtitle"></small></h3>
        <div class="media-carousel" id="sugeridos-list"></div>
    </div>

    <!-- 2. Minha Lista (obras salvas pelo botão +) -->
    <div class="media-row" id="section-minha-lista" style="display: none;">
        <h3>Minha Lista</h3>
        <div class="media-carousel" id="minha-lista-carousel"></div>
    </div>

    <!-- 3. Filmes -->
    <div class="media-row" id="section-filmes">
        <h3>Filmes</h3>
        <div class="media-carousel" id="filmes-list"></div>
    </div>

    <!-- 4. Séries -->
    <div class="media-row" id="section-series">
        <h3>Séries</h3>
        <div class="media-carousel" id="series-list"></div>
    </div>

    <!-- 5. Secções dinâmicas baseadas nos gêneros disponíveis -->
    <div id="genre-sections-container"></div>
</main>

<div class="modal-backdrop" id="modal-perfil">
    <div class="modal-box">
        <h3>Meu Perfil e Assinatura</h3>
        <form id="form-perfil">
            <div style="text-align: center; margin-bottom: 16px;">
                <img id="perfil-preview"
                     src="/midia/novo_usuario.png"
                     alt="Prévia da foto"
                     style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #e50914;">
            </div>

            <div class="input-group">
                <label style="display:block; margin-bottom:6px; color:#b3b3b3; font-size:0.9rem;">Alterar foto de perfil (PNG/JPG):</label>
                <input type="file" id="perfil-foto-input" accept="image/png, image/jpeg, image/webp" style="padding: 10px;">
            </div>

            <div class="input-group">
                <input type="text" id="perfil-username" required placeholder="Nome de usuário">
            </div>

            <label style="display:block; margin-bottom:8px; color:#b3b3b3;">Plano de Assinatura:</label>
            <select id="perfil-plano" required>
                <option value="1">Básico</option>
                <option value="2">Padrão</option>
                <option value="3">Premium</option>
            </select>

            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn-submit" style="margin-top:0;">Salvar Alterações</button>
                <button type="button" id="btn-fechar-perfil" class="btn-info" style="margin-right:0;">Cancelar</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
