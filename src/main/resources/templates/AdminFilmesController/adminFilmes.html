<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - MediaFlix</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #141414; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: #222; padding: 24px; border-radius: 8px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1, h2 { color: #e50914; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #444; text-align: left; vertical-align: middle; }
        th { background-color: #333; }
        input[type="text"], input[type="file"], select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #e50914; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #f40612; }
        .btn-edit { background-color: #0071eb; margin-right: 6px; }
        .btn-delete { background-color: #b9090b; }
        .form-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .form-group { flex: 1 1 48%; }
        #search-bar { width: 100%; max-width: 400px; margin-bottom: 20px; }
        .generos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; background: #1a1a1a; padding: 12px; border: 1px solid #444; border-radius: 6px; margin-top: 6px; margin-bottom: 12px; }
        .genero-option { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.92rem; padding: 6px 8px; border-radius: 4px; background: #292929; transition: background 0.2s; }
        .genero-option:hover { background: #383838; }
        .genero-option input[type="checkbox"] { width: 16px; height: 16px; accent-color: #e50914; margin: 0; cursor: pointer; }
        .badge-tipo { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: bold; }
        .badge-filme { background: #2e7d32; color: #fff; }
        .badge-serie { background: #1565c0; color: #fff; }
        .preview-box { background: #181818; border: 1px dashed #555; border-radius: 6px; padding: 10px; text-align: center; margin-bottom: 10px; }
        .preview-horiz { width: 220px; height: 124px; object-fit: cover; border-radius: 4px; display: none; margin: 0 auto; }
        .preview-vert { width: 100px; height: 150px; object-fit: cover; border-radius: 4px; display: none; margin: 0 auto; }
        .thumb-horiz { width: 80px; height: 45px; object-fit: cover; border-radius: 3px; }
        .thumb-vert { width: 40px; height: 60px; object-fit: cover; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <h1>Gestão de Catálogo</h1>
        <button type="button" id="btn-logout" style="background-color: #444;">Sair</button>
    </div>

    <h2>Adicionar / Editar Obra</h2>
    <form id="filmeForm">
        <input type="hidden" id="filmeId">
        <input type="hidden" id="imgHorizAtual">
        <input type="hidden" id="imgVertAtual">

        <div class="form-container">
            <div class="form-group">
                <label>Título:</label>
                <input type="text" id="titulo" required>
            </div>
            <div class="form-group">
                <label>Tipo de Obra:</label>
                <select id="tipo" required>
                    <option value="FILME">Filme</option>
                    <option value="SERIE">Série</option>
                </select>
            </div>

            <div class="form-group" style="flex: 1 1 100%;">
                <label>Gêneros (marque uma ou mais opções):</label>
                <div class="generos-grid" id="generos-checkbox-group">
                    <label class="genero-option"><input type="checkbox" name="generos" value="Ação"> Ação</label>
                    <label class="genero-option"><input type="checkbox" name="generos" value="Comédia"> Comédia</label>
                    <label class="genero-option"><input type="checkbox" name="generos" value="Drama"> Drama</label>
                    <label class="genero-option"><input type="checkbox" name="generos" value="Fantasia"> Fantasia</label>
                    <label class="genero-option"><input type="checkbox" name="generos" value="Ficção científica"> Ficção científica</label>
                    <label class="genero-option"><input type="checkbox" name="generos" value="Romance"> Romance</label>
                    <label class="genero-option"><input type="checkbox" name="generos" value="Terror"> Terror</label>
                    <label class="genero-option"><input type="checkbox" name="generos" value="Musical"> Musical</label>
                </div>
            </div>

            <div class="form-group" style="flex: 1 1 100%;">
                <label>Descrição:</label>
                <textarea id="descricao" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label>Imagem Horizontal (Banner / Card 16:9 - PNG, JPG ou WEBP):</label>
                <input type="file" id="imgHorizFile" accept="image/png, image/jpeg, image/webp">
                <div class="preview-box">
                    <img id="previewHoriz" class="preview-horiz" alt="Prévia Horizontal">
                    <small id="labelHoriz" style="color: #888;">Nenhuma imagem horizontal selecionada</small>
                </div>
            </div>

            <div class="form-group">
                <label>Imagem Vertical (Pôster 2:3 - PNG, JPG ou WEBP):</label>
                <input type="file" id="imgVertFile" accept="image/png, image/jpeg, image/webp">
                <div class="preview-box">
                    <img id="previewVert" class="preview-vert" alt="Prévia Vertical">
                    <small id="labelVert" style="color: #888;">Nenhuma imagem vertical selecionada</small>
                </div>
            </div>

            <div class="form-group">
                <label>Plano Exigido:</label>
                <select id="planoId" required>
                    <option value="1">Básico</option>
                    <option value="2">Padrão</option>
                    <option value="3">Premium</option>
                </select>
            </div>
        </div>

        <button type="submit" id="btnSalvar">Salvar Obra</button>
        <button type="button" onclick="limparFormulario()" style="background-color: #555;">Cancelar</button>
    </form>

    <hr style="border-color: #444; margin: 30px 0;">

    <h2>Lista de Filmes e Séries</h2>
    <input type="text" id="search-bar" placeholder="Pesquisar por título..." onkeyup="filtrarFilmes()">

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Horizontal</th>
            <th>Vertical</th>
            <th>Título</th>
            <th>Tipo</th>
            <th>Gêneros</th>
            <th>Plano</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody id="tabela-filmes"></tbody>
    </table>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
