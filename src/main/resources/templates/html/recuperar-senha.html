<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - MediaFlix</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">
<header class="login-header">
    <h1 class="logo">MediaFlix</h1>
</header>

<div class="login-container" id="step-1-container">
    <h2>Recuperar Senha</h2>
    <p style="color: #b3b3b3; margin-bottom: 20px; font-size: 0.9rem;">Introduza o seu e-mail para receber o código de 6 dígitos.</p>
    <form id="form-pedir-codigo">
        <div class="input-group">
            <input type="email" id="recuperar-email" required placeholder="O seu e-mail">
        </div>
        <button type="submit" class="btn-submit">Enviar Código</button>
        <div class="form-help" style="justify-content: center; margin-top: 20px;">
            <a href="login.html">Voltar ao Login</a>
        </div>
    </form>
</div>

<div class="login-container" id="step-2-container" style="display: none;">
    <h2>Nova Senha</h2>
    <p style="color: #b3b3b3; margin-bottom: 20px; font-size: 0.9rem;">Introduza o código recebido e a sua nova senha.</p>
    <form id="form-redefinir-senha">
        <div class="input-group">
            <input type="text" id="codigo-verificacao" required placeholder="Código de 6 dígitos" maxlength="6">
        </div>
        <div class="input-group">
            <input type="password" id="nova-senha" required placeholder="Nova Senha (mín. 6 caracteres)">
        </div>
        <button type="submit" class="btn-submit">Redefinir Senha</button>
    </form>
</div>

<script src="../js/app.js"></script>
</body>
</html>
