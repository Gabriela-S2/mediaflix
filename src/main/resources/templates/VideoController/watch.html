<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - MediaFlix</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js"></script>
</head>
<body>
<header id="navbar" class="black-bg">
    <a href="/index" style="text-decoration: none;"><h1 class="logo">MediaFlix</h1></a>
    <nav>
        <a href="/index">Voltar ao Início</a>
    </nav>
</header>

<main class="watch-main">
    <div class="video-player-container">
        <video controls autoplay class="video-player">
            <source src="/midia/video/nggyu.mp4" type="video/mp4">
            Seu navegador não suporta o elemento de vídeo.
        </video>
    </div>

    <div class="video-info-container">
        <h2 id="video-title">Carregando...</h2>

        <div class="video-meta">
            <span class="match">98% Relevante</span>
            <span class="rating" id="video-tipo">Filme</span>
            <span class="hd">HD</span>
        </div>

        <div class="video-details">
            <div class="description">
                <p id="video-description">Carregando sinopse...</p>

                <div class="action-buttons">
                    <button type="button" class="btn-play" id="btn-replay">▶ Assistir Novamente</button>
                    <button type="button" class="btn-round" id="btn-minha-lista" title="Adicionar à Minha Lista">+</button>
                    <button type="button" class="btn-round" id="btn-like" title="Gostei (melhora suas recomendações)">👍</button>
                </div>
            </div>

            <div class="cast-info">
                <p><strong>Gêneros:</strong> <span id="video-genre">-</span></p>
                <p><strong>Formato:</strong> <span id="video-formato-texto">Filme</span></p>
            </div>
        </div>
    </div>
</main>

</body>
</html>
