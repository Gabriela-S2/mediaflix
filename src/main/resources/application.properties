# ==========================================================
# CONFIGURAÇÕES DA BASE DE DADOS (PostgreSQL lendo do .env)
# ==========================================================

quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.driver=org.postgresql.Driver

# ==========================================================
# CONFIGURAÇÕES DO HIBERNATE ORM E JPA
# ==========================================================
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
# ==========================================================
# CONFIGURAÇÕES DO SERVIDOR HTTP E CORS
# ==========================================================
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS

smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://mediaflix.ifg.edu.br

# Estas duas linhas trabalham em conjunto para ler o JWT dos cookies:
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=jwt-token

